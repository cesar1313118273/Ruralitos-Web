<main id="statisticianPage" class="app-main hidden"><article class="section-card"><div class="section-head admission-head"><i>▦</i><div><h2>Gestión de admisión de pacientes</h2><p>Consulte y actualice la ficha completa del paciente.</p></div></div><div class="section-body"><div class="patient-search"><div><label>Identificación</label><input id="statPatientSearch" maxlength="17" inputmode="text" placeholder="Cédula, visa, pasaporte o carné"></div><button class="btn primary auto" type="button" onclick="buscarPacienteEstadistico_()">Buscar paciente</button></div><form id="statPatientForm" class="hidden"><div class="clinical-grid">
<div><label>Identificación *</label><input name="cedula" maxlength="17" inputmode="text" required></div><div><label>Tipo de documento</label><select name="tipoDocumento" required><option value="">SELECCIONE</option><option value="CC/CI">CC/CI</option><option value="VISA">VISA</option><option value="PASAPORTE">PASAPORTE</option><option value="CARNÉ DE REFUGIADO">CARNÉ DE REFUGIADO</option><option value="SIN DOCUMENTO">SIN DOCUMENTO</option></select></div><div><label>Primer apellido *</label><input name="primerApellido" required></div><div><label>Segundo apellido</label><input name="segundoApellido"></div><div><label>Primer nombre *</label><input name="primerNombre" required></div><div><label>Segundo nombre</label><input name="segundoNombre"></div><div><label>Estado civil</label><select name="estadoCivil"><option value="">SELECCIONE</option><option>SOLTERO/A</option><option>CASADO/A</option><option>DIVORCIADO/A</option><option>VIUDO/A</option><option>UNIÓN LIBRE</option><option>UNIÓN DE HECHO</option><option>NO APLICA</option></select></div><div><label>Sexo</label><select name="sexo"><option value="">SELECCIONE</option><option>MASCULINO</option><option>FEMENINO</option></select></div>
<div><label>Fecha de nacimiento</label><input name="fechaNacimiento" type="date"></div><div><label>Hora de nacimiento</label><input name="horaNacimiento" type="time"></div><div><label>Lugar de nacimiento</label><input name="lugarNacimiento"></div><div><label>Nacionalidad</label><input name="nacionalidad" value="ECUATORIANA"></div><div><label>Edad</label><input name="edad" type="number" min="0"></div><div><label>Condición de edad</label><select name="condicionEdad"><option>AÑOS</option><option>MESES</option><option>DÍAS</option><option>HORAS</option></select></div><div><label>Grupo prioritario</label><input name="grupoPrioritario"></div><div><label>Autoidentificación étnica</label><input name="autoidentificacionEtnica"></div><div><label>Nacionalidad étnica</label><input name="nacionalidadEtnica"></div><div><label>Pueblo</label><input name="pueblo"></div><div><label>Nivel de educación</label><input name="nivelEducacion"></div><div><label>Estado del nivel educativo</label><input name="estadoEducacion"></div><div><label>Tipo de empresa de trabajo</label><input name="tipoEmpresa"></div><div><label>Ocupación/profesión</label><input name="ocupacion"></div><div><label>Seguro de salud</label><input name="seguroSalud"></div><div><label>Teléfono fijo</label><input name="telefonoFijo" type="tel"></div><div><label>Teléfono celular</label><input name="telefonoCelular" type="tel"></div></div>
<h3>Residencia</h3><div class="clinical-grid"><div><label>Provincia</label><input name="provincia"></div><div><label>Cantón</label><input name="canton"></div><div><label>Parroquia</label><input name="parroquia"></div><div><label>Barrio/sector</label><input name="barrio"></div><div><label>Calle principal</label><input name="callePrincipal"></div><div><label>Calle secundaria</label><input name="calleSecundaria"></div><div class="span2"><label>Referencia domiciliaria</label><input name="referenciaDomiciliaria"></div></div><h3>Contacto de emergencia</h3><div class="clinical-grid"><div><label>Nombre</label><input name="contactoEmergencia"></div><div><label>Parentesco</label><input name="parentescoContacto"></div><div><label>Dirección</label><input name="direccionContacto"></div><div><label>Teléfono</label><input name="telefonoContacto" type="tel"></div></div><div class="actions"><button class="btn primary auto" type="submit">Guardar ficha del paciente</button></div><div id="statPatientStatus" class="selected-place hidden"></div></form></div></article></main>
