<main id="certificatePage" class="app-main hidden"><article class="section-card certificate-card"><div class="section-head certificate-head"><i>✚</i><div><h2>Certificado médico</h2><p>Busque o registre al paciente y genere el certificado de emergencia.</p></div></div><div class="section-body"><div class="patient-search certificate-search"><div><label>Número de identificación</label><input id="certificatePatientSearch" maxlength="17" placeholder="Cédula, visa, pasaporte o carné"></div><button class="btn primary auto" type="button" onclick="buscarPacienteCertificado_()">Buscar paciente</button><button class="btn soft" type="button" onclick="volverMenu_()">← Menú</button></div><div id="certificatePatientResult" class="selected-place hidden"></div><form id="certificateForm" class="hidden"><h3>Datos del paciente</h3><div class="clinical-grid certificate-patient-fields"><div><label>Tipo de identificación</label><select name="tipoDocumento" required><option value="">SELECCIONE</option><option value="CC/CI">CC/CI</option><option value="VISA">VISA</option><option value="PASAPORTE">PASAPORTE</option><option value="CARNÉ DE REFUGIADO">CARNÉ DE REFUGIADO</option><option value="SIN DOCUMENTO">SIN DOCUMENTO DE IDENTIFICACIÓN</option></select></div><div><label>Número de identificación</label><input name="cedula" maxlength="17" required></div><div><label>Primer apellido</label><input name="primerApellido" required></div><div><label>Segundo apellido</label><input name="segundoApellido"></div><div><label>Primer nombre</label><input name="primerNombre" required></div><div><label>Segundo nombre</label><input name="segundoNombre"></div><div><label>Sexo</label><select name="sexo"><option value="">Seleccione</option><option value="M">MASCULINO</option><option value="F">FEMENINO</option></select></div><div><label>Fecha de nacimiento</label><input name="fechaNacimiento" type="date"></div><div><label>Edad</label><input name="edad" type="number" min="0"></div><div><label>Unidad de edad</label><select name="tipoEdad"><option>HORAS</option><option>DÍAS</option><option>MESES</option><option selected>AÑOS</option></select></div><div><label>Teléfono celular</label><input name="telefonoCelular"></div><div><label>Nacionalidad</label><input name="nacionalidad" value="ECUATORIANA"></div></div><h3>Datos del certificado</h3><div class="clinical-grid"><div><label>Especialidad</label><select name="especialidad"><option>MEDICINA GENERAL</option><option>MEDICINA FAMILIAR</option><option>OBSTETRICIA</option><option>ODONTOLOGÍA</option><option>PSICOLOGÍA</option></select></div><div><label>Fecha de atención</label><input name="fecha" type="date" required></div><div><label>Hora de inicio</label><input name="horaInicio" type="time" required></div><div><label>Hora de finalización</label><input name="horaFin" type="time" required></div><div><label>Reposo médico</label><select id="certificateRest" name="reposo"><option value="NO">NO</option><option value="SI">SI</option></select></div><div id="certificateRestDays" class="hidden"><label>Días de reposo</label><input name="diasReposo" type="number" min="1" max="365" step="1"></div></div><h3>Diagnósticos</h3><div id="certificateDiagnoses" class="repeat-list"></div><button class="btn soft" type="button" onclick="agregarDiagnosticoCertificado_()">+ Agregar diagnóstico</button><label class="check-line certificate-sign"><input name="incluirFirma" type="checkbox" checked> Incluir automáticamente mi firma y sello</label><div id="certificateHistory" class="certificate-history hidden"></div><div class="actions"><button id="certificatePdf" class="btn primary auto" type="button" onclick="generarCertificadoUI_('PDF')">Generar PDF</button><button id="certificateExcel" class="btn soft auto" type="button" onclick="generarCertificadoUI_('EXCEL')">Generar Excel</button></div><div id="certificateStatus" class="selected-place hidden"></div></form></div></article></main>
