<main id="admissionPage" class="app-main hidden"><article class="section-card"><div class="section-head admission-head"><i>▦</i><div><h2>Panel de admisión</h2><p>Busque y actualice datos generales y de admisión del paciente.</p></div></div><div class="section-body"><div class="patient-search"><div><label>Identificación</label><input id="admissionSearch" maxlength="17"></div><button class="btn primary auto" type="button" onclick="buscarPacienteAdmision_()">Buscar paciente</button><button class="btn soft auto" type="button" onclick="iniciarPacienteSinDocumentoAdmision_()">Paciente sin documento</button></div><form id="admissionRoleForm" class="hidden"><div class="clinical-grid"><div><label>Identificación *</label><input name="cedula" maxlength="17" required readonly></div><div><label>Tipo de documento</label><select name="tipoDocumento" required><option value="">SELECCIONE</option><option value="CC/CI">CC/CI</option><option value="VISA">VISA</option><option value="PASAPORTE">PASAPORTE</option><option value="CARNÉ DE REFUGIADO">CARNÉ DE REFUGIADO</option><option value="SIN DOCUMENTO">SIN DOCUMENTO</option></select></div><div><label>Primer apellido</label><input name="primerApellido"></div><div><label>Segundo apellido</label><input name="segundoApellido"></div><div><label>Primer nombre</label><input name="primerNombre"></div><div><label>Segundo nombre</label><input name="segundoNombre"></div><div><label>Fecha de nacimiento</label><input name="fechaNacimiento" type="date"></div><div><label>Sexo</label><select name="sexo"><option>MASCULINO</option><option>FEMENINO</option></select></div><div><label>Teléfono celular</label><input name="telefonoCelular"></div><div><label>Provincia</label><input name="provincia"></div><div><label>Cantón</label><input name="canton"></div><div><label>Parroquia</label><input name="parroquia"></div><div class="span2"><label>Dirección domiciliaria</label><input name="referenciaDomiciliaria"></div></div><h3>Datos de admisión</h3><div class="clinic
