<main id="historyPage" class="app-main hidden"><article class="section-card"><div class="section-head history-head"><i>▤</i><div><h2>Historias clínicas</h2><p>Busque pacientes por fecha, identidad o rango específico de edad.</p></div></div><div class="section-body"><div class="history-filters"><div><label>Desde</label><input id="historyFrom" type="date"></div><div><label>Hasta</label><input id="historyTo" type="date"></div><div><label>Identificación o paciente</label><input id="historyQuery" type="search" placeholder="Identificación, nombres o apellidos"></div><div><label>Unidad de edad</label><select id="historyAgeUnit"><option value="">Todas</option><option value="HORAS">Horas</option><option value="DIAS">Días</option><option value="MESES">Meses</option><option value="ANOS">Años</option></select></div><div><label>Edad mínima</label><input id="historyAgeMin" type="number" min="0" step="1" placeholder="Mínima"></div><div><label>Edad máxima</label><input id="historyAgeMax" type="number" min="0" step="1" placeholder="Máxima"></div><div class="align-end"><button class="btn primary auto" type="button" onclick="cargarHistorias_()">Buscar</button></div><div class="align-end"><button class="btn soft" type="button" onclick="limpiarFiltrosHistorias_()">Limpiar</button></div></div><div class="history-toolbar"><button class="btn soft" type="button" onclick="volverMenu_()">← Menú principal</button><span id="historyStatus"></span></div><div id="historyList" class="history-list"></div><section id="historyAuditPanel" class="section-card hidden" style="margin-top:18px"><div class="section-head"><i>↺</i><div><h2>Auditoría de la historia clínica</h2><p>Versiones conservadas por modificación o eliminación lógica.</p></div><button class="btn soft auto" type="button" onclick="cerrarAuditoriaHistoria_()">Cerrar</button></div><div class="section-body"><div id="historyAuditContent" class="history-list"></div></div></section></div></article></main>
