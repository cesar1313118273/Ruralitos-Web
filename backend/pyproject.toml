[project]
name = "ruralitos-api"
version = "0.1.0"
description = "API de calculos, estadisticas e integracion para Ruralitos Web"
requires-python = ">=3.13"
dependencies = [
  "fastapi[standard]",
  "httpx",
  "openpyxl",
  "pandas",
  "pydantic-settings",
  "supabase",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
