async function descargarArchivoSeguro_(ticket,nombre,ventana){
  if(!ticket)return false;
  const r=await run('obtenerArchivoSeguro',token,ticket);
  if(!r||!r.base64)throw new Error('No se recibió el contenido del archivo.');
  const binario=atob(r.base64),bytes=new Uint8Array(binario.length);
  for(let i=0;i<binario.length;i++)bytes[i]=binario.charCodeAt(i);
  const url=URL.createObjectURL(new Blob([bytes],{type:r.mime||'application/octet-stream'}));
  const destino=(ventana&&!ventana.closed)?ventana.document:document;
  const cuerpo=destino.body||document.body,enlace=destino.createElement('a');
  enlace.href=url;enlace.download=r.nombre||nombre||'documento';enlace.style.display='none';cuerpo.appendChild(enlace);enlace.click();enlace.remove();
  if(ventana&&!ventana.closed){try{ventana.document.body.innerHTML='<p style="font:16px Arial;padding:25px">Descarga segura iniciada. Puede cerrar esta ventana.</p>'}catch(e){}}
  setTimeout(()=>URL.revokeObjectURL(url),60000);
  return true;
}

function configurarPicker(inputId,resultsId,onSelect){const input=$('#'+inputId),results=$('#'+resultsId);if(!input||!results)return;input.addEventListener('input',()=>{if(inputId==='regSearch'){seleccionRegistro=null;const codigo=$('#regCodigo');if(codigo)codigo.value='';const seleccionado=$('#regSelected');if(seleccionado)seleccionado.classList.add('hidden')}if(!establecimientos.length)cargarEstablecimientos_().then(()=>mostrarResultados(inputId,resultsId,onSelect));else mostrarResultados(inputId,resultsId,onSelect)});input.addEventListener('focus',()=>{if(!establecimientos.length)cargarEstablecimientos_().then(()=>mostrarResultados(inputId,resultsId,onSelect));else mostrarResultados(inputId,resultsId,onSelect)});document.addEventListener('click',e=>{if(!e.target.closest('#'+inputId)&&!e.target.closest('#'+resultsId))results.classList.add('hidden')})}
async function cargarEstablecimientos_(forzar){
  if(establecimientos.length&&!forzar)return establecimientos;
  if(cargaEstablecimientosPromise)return cargaEstablecimientosPromise;
  const cajas=['regResults','appResults','profileEstResults'].map(id=>$('#'+id)).filter(Boolean);cajas.forEach(c=>{c.innerHTML=cargaLista_('Buscando centros de salud…');c.classList.remove('hidden')});
  cargaEstablecimientosPromise=run('obtenerEstablecimientos').then(lista=>{establecimientos=Array.isArray(lista)?lista:[];if(!establecimientos.length)throw new Error('No se encontraron establecimientos en la base de datos.');return establecimientos}).catch(e=>{establecimientos=[];const texto=e&&e.message?e.message:String(e);cajas.forEach(c=>{c.innerHTML='<div class="no-results">No se pudieron cargar los centros: '+esc(texto)+'</div>';c.classList.remove('hidden')});mensaje(texto,true);return[]}).finally(()=>{cargaEstablecimientosPromise=null});
  return cargaEstablecimientosPromise;
}
function normalizar(v){return String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim()}
function mostrarResultados(inputId,resultsId,onSelect){const input=$('#'+inputId),box=$('#'+resultsId);if(!input||!box)return;const q=normalizar(input.value);const items=establecimientos.filter(e=>normalizar([e.nombre,e.unicodigo,e.institucion,e.provincia,e.canton,e.parroquia].join(' ')).includes(q)).slice(0,60);box.innerHTML='';box.classList.remove('hidden');if(!items.length){box.innerHTML='<div class="no-results">No se encontraron centros de salud.</div>';return}items.forEach(e=>{const b=document.createElement('button');b.type='button';b.className='picker-item';b.innerHTML=`<span><strong>${esc(e.nombre)}</strong><small>${esc([e.institucion,e.provincia,e.canton,e.parroquia].filter(Boolean).join(' · '))}</small></span><span class="picker-code">${esc(e.unicodigo)}</span>`;b.onclick=()=>{onSelect(e);box.classList.add('hidden')};box.appendChild(b)})}

function prepararImagenPerfil_(fileId,canvasId,tipo){const input=$('#'+fileId);if(!input)return;input.onchange=()=>{const file=input.files[0];if(!file)return;if(file.size>5000000)return mensaje('La imagen no debe superar 5 MB.',true);const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{if(tipo==='firma')firmaOriginal=img;else selloOriginal=img;procesarImagen_(img,canvasId,tipo)};img.src=reader.result};reader.readAsDataURL(file)}}
function procesarImagen_(img,canvasId,tipo){const maxW=tipo==='firma'?1600:1200,maxH=800,scale=Math.min(1,maxW/img.width,maxH/img.height),w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale)),tmp=document.createElement('canvas');tmp.width=w;tmp.height=h;const x=tmp.getContext('2d');x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';x.drawImage(img,0,0,w,h);const data=x.getImageData(0,0,w,h),p=data.data,control=canvasId.indexOf('profile')===0?$('#profileBackgroundThreshold'):$('#backgroundThreshold'),sensibilidad=Number(control&&control.value||0),transicion=18;for(let i=0;i<p.length;i+=4){const distanciaBlanco=255-(p[i]+p[i+1]+p[i+2])/3;if(distanciaBlanco<=sensibilidad)p[i+3]=0;else if(distanciaBlanco<sensibilidad+transicion)p[i+3]=Math.round(255*(distanciaBlanco-sensibilidad)/transicion)}x.putImageData(data,0,0);const box=recorte_(data,w,h),objetivoW=tipo==='firma'?1400:900,objetivoH=tipo==='firma'?500:900,ampliacion=Math.max(1,Math.min(3,objetivoW/box.w,objetivoH/box.h)),salidaW=Math.max(1,Math.round(box.w*ampliacion)),salidaH=Math.max(1,Math.round(box.h*ampliacion)),c=$('#'+canvasId);c.width=salidaW;c.height=salidaH;const ctx=c.getContext('2d');ctx.clearRect(0,0,salidaW,salidaH);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(tmp,box.x,box.y,box.w,box.h,0,0,salidaW,salidaH);const seguro=limitarCanvasPng_(c),url=seguro.toDataURL('image/png');if(tipo==='firma')firmaProcesada=url;else selloProcesado=url}
function recorte_(data,w,h){const p=data.data;let minX=w,minY=h,maxX=-1,maxY=-1;for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(p[(y*w+x)*4+3]>20){minX=Math.min(minX,x);minY=Math.min(minY,y);maxX=Math.max(maxX,x);maxY=Math.max(maxY,y)}if(maxX<0)return{x:0,y:0,w,h};const pad=8;minX=Math.max(0,minX-pad);minY=Math.max(0,minY-pad);maxX=Math.min(w-1,maxX+pad);maxY=Math.min(h-1,maxY+pad);return{x:minX,y:minY,w:maxX-minX+1,h:maxY-minY+1}}

function diagnosticosUnicosCliente_(lista){
  const vistos={};
  return (lista||[]).map(x=>({cie:String(x.cie||x.cie10||'').trim().toUpperCase(),descripcion:String(x.descripcion||'').trim().toUpperCase()})).filter(x=>{
    if(!x.cie&&!x.descripcion)return false;
    const clave=x.cie?x.cie.replace(/[^A-Z0-9]/g,''):'DESC:'+normalCliente_(x.descripcion);
    if(vistos[clave])return false;
    vistos[clave]=true;return true

async function buscarPacienteEpi_() {
  const entrada = $('#epiCedula');
  const id = normalizarIdentificacionCliente_(entrada.value,'OTRO');
  if (!id) return mostrarAviso_('Ingrese el número de identificación del paciente.','error');
  const resultado = $('#epiPatientResult'), mini = $('#epiSearchMini');
  mini.innerHTML = cargaLista_('Buscando atención y datos del paciente…');
  mini.classList.remove('hidden');
  resultado.classList.add('hidden');
  try {
    const r = await run('buscarPacienteEpi',token,id);
    epiPacienteActual2_ = Object.assign({cedula:id},r.paciente || {});
    epiPrefillActual2_ = r.prefill || {};
    const nombre = [
      epiPacienteActual2_.primerApellido,epiPacienteActual2_.segundoApellido,
      epiPacienteActual2_.primerNombre,epiPacienteActual2_.segundoNombre
    ].filter(Boolean).join(' ');
    resultado.innerHTML =
      '<b>' + esc(nombre || 'PACIENTE SIN NOMBRE REGISTRADO') + '</b>' +
      '<div class="patient-result-meta">' +
        '<span><b>Identificación:</b> ' + esc(epiPacienteActual2_.cedula || id) + '</span>' +
        '<span><b>Edad:</b> ' + esc(epiPacienteActual2_.edad || '—') + ' ' +
          esc(epiPacienteActual2_.condicionEdad || '') + '</span>' +
        '<span><b>Sexo:</b> ' + esc(epiPacienteActual2_.sexo || '—') + '</span>' +
      '</div>' +
      (r.ultimaAtencion
        ? '<small>Datos clínicos recuperados de la atención ' +
          esc(String(r.ultimaAtencion.fecha || '').slice(0,10)) + '.</small>'
        : '<small>No existe una atención previa: complete manualmente la ficha.</small>');
    resultado.classList.remove('hidden');
    llenarFormularioEpi2_(r);
  } catch (e) {
    epiPacienteActual2_ = null;
    resultado.textContent = e.message || String(e);
    resultado.classList.remove('hidden');
  } finally {
    mini.classList.add('hidden');
    mini.innerHTML = '';
  }
}

function llenarFormularioEpi2_(respuesta) {
  const form = $('#epiForm');
  form.reset();
  limpiarRepetiblesEpi2_();
  const paciente = respuesta.paciente || {}, prefill = respuesta.prefill || {};
  form.querySelectorAll('[data-epi-patient]').forEach(function(campo) {
    campo.value = valorFechaClienteEpi2_(paciente[campo.dataset.epiPatient],campo.type);
  });
  actualizarResumenPacienteEpi2_(paciente);
  Object.keys(prefill).forEach(function(nombre) {
    form.querySelectorAll('[name="' + nombre + '"]').forEach(function(campo) {
      if (campo.type !== 'radio' && campo.type !== 'checkbox') {
        campo.value = valorFechaClienteEpi2_(prefill[nombre],campo.type);
      }
    });
  });
  const ultima = respuesta.ultimaAtencion || {};
  if (form.elements.idRegistro008) form.elements.idRegistro008.value = ultima.idRegistro || '';
  const select = $('#epiDiagnosis');
  select.innerHTML = '<option value="">SELECCIONE UN DIAGNÓSTICO</option>' +
    (respuesta.diagnosticos || []).map(function(dx) {
      const valor = [dx.cie,dx.descripcion].filter(Boolean).join(' - ');
      return '<option value="' + esc(valor) + '">' +
        esc((dx.tipo ? dx.tipo + ' · ' : '') + valor) + '</option>';
    }).join('');
  const hoy = fechaLocalEpi2_(new Date());
  if (!form.elements.fechaAtencion.value) form.elements.fechaAtencion.value = hoy;
  if (!form.elements.fechaInvestigacion.value) form.elements.fechaInvestigacion.value = hoy;
  if (form.elements.semanaEpidemiologica) {
    form.elements.semanaEpidemiologica.value = semanaEpidemiologicaEpi2_(
      form.elements.fechaAtencion.value || hoy
    );
  }
  form.classList.remove('hidden');
  cambiarTipoEpiUI_();
}


function actualizarResumenPacienteEpi2_(paciente) {
  const p = paciente || {};
  const nombre = [
    p.primerApellido,p.segundoApellido,p.primerNombre,p.segundoNombre
  ].filter(Boolean).join(' ');
  const direccion = [
    p.callePrincipal,p.calleSecundaria,p.referenciaDomiciliaria
  ].filter(Boolean).join(', ');
  const nombreCampo = $('#epiPatientFullName');
  const direccionCampo = $('#epiPatientAddress');
  if (nombreCampo) nombreCampo.value = nombre;
  if (direccionCampo) direccionCampo.value = direccion;
}

function valorFechaClienteEpi2_(valor,tipo) {
  if (valor == null) return '';
  if (tipo === 'date') return String(valor).slice(0,10);
  return valor;
}

function cambiarTipoEpiUI_() {

  const grupal = $('#epiGroupFields'), individualBox = $('#epiIndividualFields');

function datosFormularioEpi2_() {
  const form = $('#epiForm'), salida = {};
  form.querySelectorAll('input[name],select[name],textarea[name]').forEach(function(campo) {
    if (campo.closest('[data-epi-list]')) return;
    const bloque = campo.closest('#epiGroupFields,#epiIndividualFields');
    if (bloque && bloque.classList.contains('hidden')) return;
    if (campo.type === 'radio') {
      if (campo.checked) salida[campo.name] = campo.value;
      return;
    }
    if (campo.type === 'checkbox') {
      salida[campo.name] = campo.checked;
      return;
    }
    if (campo.value !== '' || salida[campo.name] === undefined) {
      salida[campo.name] = campo.value;
    }
  });
  form.querySelectorAll('[data-epi-list]').forEach(function(caja) {
    if (caja.closest('.hidden')) return;
    salida[caja.dataset.epiList] = Array.from(
      caja.querySelectorAll('input[type="checkbox"]:checked')
    ).map(function(campo) { return campo.value; });
  });
  salida.muestrasCierre = leerRepetiblesEpi2_('epiGroupSamples');
  salida.contactos = leerRepetiblesEpi2_('epiContacts');
  salida.actividadesGenerales = leerActividadesEpi2_('epiGeneralActivities');
  salida.actividadesEspecificas = leerActividadesEpi2_('epiSpecificActivities');
  salida.generarPdf = $('#epiOutputPdf').checked;
  salida.generarExcel = $('#epiOutputExcel').checked;
  return salida;
}

function pacienteFormularioEpi2_() {
  const paciente = Object.assign({},epiPacienteActual2_ || {});
  document.querySelectorAll('#epiForm [data-epi-patient]').forEach(function(campo) {
    paciente[campo.dataset.epiPatient] = campo.value;
  });
  return paciente;
}

async function generarEpiAvanzadaUI_(evento) {
  evento.preventDefault();
  if (!epiPacienteActual2_) {
    return mostrarAviso_('Primero busque el paciente.','error');
  }
  const formulario = datosFormularioEpi2_();
  if (!formulario.diagnostico) {
    return mostrarAviso_('Seleccione un diagnóstico para la EPI.','error');
  }
  if (!formulario.generarPdf && !formulario.generarExcel) {
    return mostrarAviso_('Seleccione PDF, Excel o ambos.','error');
  }
  const boton = $('#epiGenerate'), estado = $('#epiStatus');
  const ventanas = reservarDescargasEpi2_(formulario);
  boton.disabled = true;
  boton.textContent = 'Generando documento…';
  estado.textContent = 'Preparando los formatos seleccionados…';
  estado.classList.remove('hidden');
  try {
    const respuesta = await run('generarEpiAvanzada',token,{
      paciente:pacienteFormularioEpi2_(),formulario:formulario
    });
    await descargarSalidasEpi2_(respuesta,ventanas);
    estado.innerHTML = '<b>EPI generada y descargada de forma segura.</b>';
  } catch (e) {
    ventanas.forEach(function(ventana) {
      try { if (ventana && !ventana.closed) ventana.close(); } catch (x) {}
    });
    estado.textContent = e.message || String(e);
  } finally {
    boton.disabled = false;
    boton.textContent = 'Generar EPI seleccionada';
  }
}

function reservarDescargasEpi2_(formulario) {
  const cantidad = (formulario.generarPdf ? 1 : 0) + (formulario.generarExcel ? 1 : 0);
  const ventanas = [];
  for (let i = 0; i < cantidad; i++) {
    const ventana = window.open('about:blank','_blank');
    if (ventana) {
      ventana.document.write('<p style="font:16px Arial;padding:25px">Preparando descarga EPI…</p>');
      ventanas.push(ventana);
    } else {
      ventanas.push(null);
    }
  }
  return ventanas;
}

async function descargarSalidasEpi2_(respuesta,ventanas) {
  const archivos=[];
  if(respuesta.pdfTicket)archivos.push({ticket:respuesta.pdfTicket,nombre:respuesta.pdfNombre||((respuesta.nombre||'EPI')+'.pdf')});
  if(respuesta.excelTicket)archivos.push({ticket:respuesta.excelTicket,nombre:respuesta.excelNombre||((respuesta.nombre||'EPI')+'.xlsx')});
  for(let i=0;i<archivos.length;i++)await descargarArchivoSeguro_(archivos[i].ticket,archivos[i].nombre,(ventanas||[])[i]);
}

  }).filter(function(objeto) {

function fechaLocalEpi2_(fecha) {
  const pad = function(n) { return String(n).padStart(2,'0'); };
  return fecha.getFullYear() + '-' + pad(fecha.getMonth()+1) + '-' + pad(fecha.getDate());
}

function semanaEpidemiologicaEpi2_(fechaTexto) {
  const fecha = new Date(fechaTexto + 'T12:00:00');
  const jueves = new Date(fecha);
  jueves.setDate(fecha.getDate() + 3 - ((fecha.getDay()+6)%7));
  const primero = new Date(jueves.getFullYear(),0,4);
  return 1 + Math.round(((jueves-primero)/86400000 - 3 + ((primero.getDay()+6)%7))/7);
}

  const box=$('#evolutionList'),count=$('#evolutionCount');if(!box||!count)return;const lista=evolucionesEpisodio_||[],dur=duracionEvolucion_(lista);count.textContent=lista.length+' '+(lista.length===1?'registro':'registros')+(dur?' · '+dur+' de seguimiento':'');if(!lista.length){box.innerHTML='<div class="no-results">Todavía no hay evoluciones u observaciones registradas.</div>';return}
  box.innerHTML=lista.map((x,i)=>{const pa=x.pas||x.pad?(x.pas||'—')+'/'+(x.pad||'—'):'',chips=[x.tipoEvento||'',x.condicionClinica&&normalCliente_(x.condicionClinica)!=='NO ESPECIFICADO'?x.condicionClinica:'',x.temperatura?'T '+x.temperatura+'°C':'',pa?'PA '+pa:'',x.pulso?'FC '+x.pulso:'',x.frecuenciaRespiratoria?'FR '+x.frecuenciaRespiratoria:'',x.pulsioximetria?'SatO₂ '+x.pulsioximetria+'%':'',x.glasgowTotal?'GCS '+x.glasgowTotal:''].filter(Boolean).map(v=>'<span>'+esc(v)+'</span>').join(''),partes=[];if(x.evolucionClinica)partes.push('<p>'+esc(x.evolucionClinica)+'</p>');if(x.procedimientos)partes.push('<small><b>Procedimientos:</b> '+esc(x.procedimientos)+'</small>');if(x.medicamentosAdministrados)partes.push('<small><b>Medicamentos:</b> '+esc(x.medicamentosAdministrados)+'</small>');if(x.respuestaClinica)partes.push('<small><b>Respuesta:</b> '+esc(x.respuestaClinica)+'</small>');if(x.planConducta)partes.push('<small><b>Plan:</b> '+esc(x.planConducta)+'</small>');if(x.destino)partes.push('<small><b>Situación/destino:</b> '+esc(x.destino)+'</small>');const tieneSignos=['temperatura','pas','pad','pulso','frecuenciaRespiratoria','pulsioximetria','glicemia','llenadoCapilar'].some(k=>x[k]!==''&&x[k]!==null&&x[k]!==undefined);return '<article class="evolution-record"><div class="evolution-time"><b>'+esc(String(x.fechaRegistro||'').slice(0,10))+' '+esc(String(x.horaRegistro||'').slice(0,5))+'</b><small>'+esc(x.profesional||'')+'</small></div><div class="evolution-body"><div class="evolution-chips">'+chips+'</div>'+partes.join('')+'</div><div class="evolution-record-actions">'+(tieneSignos?'<button class="btn soft auto" type="button" onclick="aplicarEvolucionAClinica_(evolucionesEpisodio_['+i+'])">Aplicar signos</button>':'')+'</div></article>'}).join('');
}
function aplicarEvolucionAClinica_(x){
  if(!x)return;const f=$('#clinicalForm');if(!f)return;['temperatura','pas','pad','pulso','frecuenciaRespiratoria','pulsioximetria','glicemia','llenadoCapilar'].forEach(k=>{const e=f.elements[k];if(e&&x[k]!==undefined&&x[k]!==null&&x[k]!=='')e.value=x[k]});actualizarValidacionVitalesUI_();$('#clinicalSection').classList.remove('hidden');mostrarClinical_(2);$('#evolutionSection').classList.add('hidden');$('#clinicalSection').scrollIntoView({behavior:'smooth',block:'start'});mostrarAviso_('Signos de la evolución aplicados a la atención actual.','info');
}
function cargarUltimosSignosEnEvolucion_(){
  const f=$('#evolutionForm');if(!f)return;const tiene=x=>['temperatura','pas','pad','pulso','frecuenciaRespiratoria','pulsioximetria','glicemia','llenadoCapilar','glasgowTotal','glasgow'].some(k=>x&&x[k]!==undefined&&x[k]!==null&&x[k]!=='');const candidatos=[];(controlesSignosEpisodio_||[]).filter(tiene).forEach(x=>candidatos.push(x));(registrosCriticosEpisodio_||[]).filter(tiene).forEach(x=>candidatos.push(x));(triajesEpisodio_||[]).filter(tiene).forEach(x=>candidatos.push(x));(evolucionesEpisodio_||[]).filter(tiene).forEach(x=>candidatos.push(x));if(!candidatos.length)return alert('No hay signos vitales previos en este episodio.');const fecha=x=>String(x.fechaControl||x.fechaRegistro||x.fechaTriage||'').slice(0,10),hora=x=>String(x.horaControl||x.horaRegistro||x.horaTriage||'00:00').slice(0,5);candidatos.sort((a,b)=>(fecha(a)+'T'+hora(a)).localeCompare(fecha(b)+'T'+hora(b)));const x=candidatos[candidatos.length-1],mapa={temperatura:'temperatura',pas:'pas',pad:'pad',pulso:'pulso',frecuenciaRespiratoria:'frecuenciaRespiratoria',pulsioximetria:'pulsioximetria',glicemia:'glicemia',llenadoCapilar:'llenadoCapilar'};Object.keys(mapa).forEach(k=>{if(f.elements[mapa[k]]&&x[k]!==undefined&&x[k]!==null&&x[k]!=='')f.elements[mapa[k]].value=x[k]});if(f.elements.glasgowTotal&&x.glasgowTotal)f.elements.glasgowTotal.value=x.glasgowTotal;else if(f.elements.glasgowTotal&&x.glasgow)f.elements.glasgowTotal.value=x.glasgow;mostrarAviso_('Se cargaron los signos vitales más recientes del episodio.','info');
}
